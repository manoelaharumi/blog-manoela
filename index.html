<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Sapatos</title>
  <style>
    header {
      background-color: #D9A404;
      color: #000000;
      text-align: center;
      padding: 20px;
    }
    main {
      background-color: #000000;
      color: #FFFFFF;
      padding: 20px;
    }
    section {
      margin: 20px 0;
    }
    h2 {
      color: #D9A404;
    }
    .produtos {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .produto {
      background-color: #1a1a1a;
      border: 2px solid #D9A404;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      width: 200px;
    }
    img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }
    footer {
      background-color: #D9A404;
      color: #000000;
      text-align: center;
      padding: 16px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Loja de Sapatos Elegance</h1>
    <h3>Estilo e conforto para seus pés 👟👠🥿</h3>
  </header>
  <main>
    <section>
      <h2>Nossos Produtos</h2>
      <div class="produtos">
        <div class="produto">
          <img src="https://i.postimg.cc/vZJ6FF6b/41PENVd-Csk-L-AC-SY900.jpg" alt="Sapato Social">
          <p>Sapato Social</p>
          <p>R$ 199,90</p>
        </div>
        <div class="produto">
          <img src="https://i.postimg.cc/vBd99FQk/39520-5-002-1-(1).webp" alt="Tênis Moderno">
          <p>Tênis Moderno</p>
          <p>R$ 249,90</p>
        </div>
        <div class="produto">
          <img src="https://i.postimg.cc/vBPbNjyY/sandalia-rasteira-mississipi-eloise-feminina-45bd74791282bcd4649ad766bd05708c.jpg" alt="Sandália Feminina">
          <p>Sandália Feminina</p>
          <p>R$ 149,90</p>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <p>📍 Rua das Flores, 123 - Londrina/PR</p>
    <p>📞 (43) 3333-4444</p>
    <p>&copy; 2026 Loja de Sapatos Elegance | por: Manoela Harumi</p>
  </footer>
</body>
</html>
